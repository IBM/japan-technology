<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo テスト</title>
  <!-- フォント: IBM Plex Sans JP(Light 300 / Medium 500)。オンライン時のみ読み込まれ、オフラインでは OS の日本語フォントで表示される -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;500&display=swap">
  <style>
    /* IBM Design Language (Carbon) の配色・余白・タイポグラフィ */
    :root {
      --bg: #ffffff;
      --layer: #f4f4f4;
      --border: #e0e0e0;
      --text: #161616;
      --text-secondary: #525252;
      --green: #198038;
      --green-bg: #defbe6;
      --red: #da1e28;
      --red-bg: #fff1f1;
      --masthead: #161616;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "IBM Plex Sans JP", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.5;
    }

    header {
      background: var(--masthead);
      color: #ffffff;
      height: 48px;
      border-bottom: 1px solid #393939;
    }
    header h1 {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px;
      line-height: 48px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    main { max-width: 800px; margin: 0 auto; padding: 48px 16px; }
    h2 { margin: 0 0 24px; font-size: 28px; font-weight: 300; line-height: 1.3; }

    #summary {
      margin: 0 0 24px;
      padding: 16px;
      background: var(--layer);
      border-left: 4px solid var(--text-secondary);
      font-weight: 500;
    }
    #summary.all-pass { border-left-color: var(--green); }
    #summary.has-fail { border-left-color: var(--red); }

    #results { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
    #results li {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      border-left: 4px solid transparent;
    }
    #results li.pass { border-left-color: var(--green); background: var(--green-bg); }
    #results li.fail { border-left-color: var(--red); background: var(--red-bg); }
    #results li div { font-weight: 300; }
    #results li .status { font-weight: 500; }
    #results li.pass .status { color: var(--green); }
    #results li.fail .status { color: var(--red); }
    pre {
      margin: 8px 0 0;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 300;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header><h1>IBM Bob ハンズオン</h1></header>
  <main>
    <h2>ToDo テスト</h2>
    <div id="summary"></div>
    <ul id="results"></ul>
  </main>

  <script src="todo-logic.js"></script>
  <script>
    const results = [];

    function test(name, fn) {
      try {
        fn();
        results.push({ name, ok: true });
      } catch (e) {
        results.push({ name, ok: false, message: e.message });
      }
    }

    function assertEqual(actual, expected) {
      const a = JSON.stringify(actual);
      const e = JSON.stringify(expected);
      if (a !== e) {
        throw new Error('期待値: ' + e + '\n実際の値: ' + a);
      }
    }

    const sample = () => [
      { id: 1, title: 'A', done: false },
      { id: 2, title: 'B', done: true },
      { id: 3, title: 'C', done: false },
    ];

    // T1
    test('T1: 空配列に追加すると件数が1増え、id は 1、done は false になる', () => {
      assertEqual(addTodo([], '牛乳'), [{ id: 1, title: '牛乳', done: false }]);
    });
    test('T1: 既存の要素があれば id は最大 id + 1 になる', () => {
      const result = addTodo(sample(), 'D');
      assertEqual(result.length, 4);
      assertEqual(result[3], { id: 4, title: 'D', done: false });
    });

    // T2
    test('T2: 空文字は追加されない', () => {
      assertEqual(addTodo(sample(), ''), sample());
    });
    test('T2: 空白のみは追加されない', () => {
      assertEqual(addTodo(sample(), '   '), sample());
    });

    // T3
    test('T3: 前後の空白は除去される', () => {
      assertEqual(addTodo([], '  牛乳  ')[0].title, '牛乳');
    });

    // T4
    test('T4: 切り替えると指定した id の done が true になる', () => {
      assertEqual(toggleTodo(sample(), 1)[0].done, true);
    });
    test('T4: 存在しない id では内容が変わらない', () => {
      assertEqual(toggleTodo(sample(), 99), sample());
    });

    // T5
    test('T5: 2回切り替えると done が元に戻る', () => {
      assertEqual(toggleTodo(toggleTodo(sample(), 1), 1), sample());
    });

    // T6
    test('T6: 削除すると指定した要素だけが消え、ほかは残る', () => {
      assertEqual(removeTodo(sample(), 2), [
        { id: 1, title: 'A', done: false },
        { id: 3, title: 'C', done: false },
      ]);
    });
    test('T6: 存在しない id では何も消えない', () => {
      assertEqual(removeTodo(sample(), 99), sample());
    });

    // T7
    test('T7: addTodo は元の配列を変更しない', () => {
      const original = sample();
      addTodo(original, 'D');
      assertEqual(original, sample());
    });
    test('T7: toggleTodo は元の配列を変更しない', () => {
      const original = sample();
      toggleTodo(original, 1);
      assertEqual(original, sample());
    });
    test('T7: removeTodo は元の配列を変更しない', () => {
      const original = sample();
      removeTodo(original, 1);
      assertEqual(original, sample());
    });

    // 結果の表示
    const list = document.getElementById('results');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'pass' : 'fail';
      const head = document.createElement('div');
      const status = document.createElement('span');
      status.className = 'status';
      status.textContent = r.ok ? 'PASS: ' : 'FAIL: ';
      head.append(status, r.name);
      li.appendChild(head);
      if (!r.ok) {
        const pre = document.createElement('pre');
        pre.textContent = r.message;
        li.appendChild(pre);
      }
      list.appendChild(li);
    }
    const passed = results.filter((r) => r.ok).length;
    const summary = document.getElementById('summary');
    summary.textContent = results.length + '件中' + passed + '件 PASS';
    summary.className = passed === results.length ? 'all-pass' : 'has-fail';
  </script>
</body>
</html>
