<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="430" fill="#ffffff"/>
  <!-- タイトル -->
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#161616">Planning Analytics as a Service オンボーディングの流れ</text>

  <!-- フェーズボックス共通定義: 4箱 x=40,340,640,940 幅220 -->
  <!-- 矢印 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f62fe"/>
    </marker>
  </defs>
  <line x1="266" y1="200" x2="332" y2="200" stroke="#0f62fe" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="566" y1="200" x2="632" y2="200" stroke="#0f62fe" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="866" y1="200" x2="932" y2="200" stroke="#0f62fe" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 01 プロビジョニング -->
  <g>
    <rect x="40" y="80" width="226" height="240" rx="10" fill="#edf5ff" stroke="#0f62fe" stroke-width="2"/>
    <rect x="40" y="80" width="226" height="58" rx="10" fill="#0f62fe"/>
    <rect x="40" y="118" width="226" height="20" fill="#0f62fe"/>
    <circle cx="72" cy="109" r="18" fill="#ffffff"/>
    <text x="72" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f62fe">1</text>
    <text x="100" y="103" font-size="16" font-weight="bold" fill="#ffffff">プロビジョニング</text>
    <text x="100" y="124" font-size="12" fill="#d0e2ff">Provisioning</text>
    <text x="58" y="170" font-size="13.5" fill="#161616">・契約と Welcome メール</text>
    <text x="58" y="200" font-size="13.5" fill="#161616">・IBM SaaS Console</text>
    <text x="58" y="230" font-size="13.5" fill="#161616">・インスタンス作成</text>
    <text x="70" y="252" font-size="12" fill="#525252">（リージョン＝データ所在地）</text>
    <text x="58" y="284" font-size="13.5" fill="#161616">・環境 URL の確認</text>
  </g>

  <!-- 02 構成 -->
  <g>
    <rect x="340" y="80" width="226" height="240" rx="10" fill="#edf5ff" stroke="#0f62fe" stroke-width="2"/>
    <rect x="340" y="80" width="226" height="58" rx="10" fill="#0f62fe"/>
    <rect x="340" y="118" width="226" height="20" fill="#0f62fe"/>
    <circle cx="372" cy="109" r="18" fill="#ffffff"/>
    <text x="372" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f62fe">2</text>
    <text x="400" y="103" font-size="16" font-weight="bold" fill="#ffffff">構成</text>
    <text x="400" y="124" font-size="12" fill="#d0e2ff">Configuration</text>
    <text x="358" y="170" font-size="13.5" fill="#161616">・サポート／認証の整備</text>
    <text x="358" y="200" font-size="13.5" fill="#161616">・ファイル／ODBC 連携</text>
    <text x="358" y="230" font-size="13.5" fill="#161616">・PAfE の配布</text>
    <text x="358" y="260" font-size="13.5" fill="#161616">・環境・ユーザー・</text>
    <text x="367" y="284" font-size="13.5" fill="#161616">バックアップの管理設計</text>
  </g>

  <!-- 03 移行または新規作成 -->
  <g>
    <rect x="640" y="80" width="226" height="240" rx="10" fill="#edf5ff" stroke="#0f62fe" stroke-width="2"/>
    <rect x="640" y="80" width="226" height="58" rx="10" fill="#0f62fe"/>
    <rect x="640" y="118" width="226" height="20" fill="#0f62fe"/>
    <circle cx="672" cy="109" r="18" fill="#ffffff"/>
    <text x="672" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f62fe">3</text>
    <text x="700" y="103" font-size="16" font-weight="bold" fill="#ffffff">移行または新規作成</text>
    <text x="700" y="124" font-size="12" fill="#d0e2ff">Migrate / Create</text>
    <text x="658" y="170" font-size="13.5" fill="#161616">・新規モデル構築</text>
    <text x="658" y="200" font-size="13.5" fill="#161616">・v11 → v12 移行</text>
    <text x="670" y="222" font-size="12" fill="#525252">（Migration Utility）</text>
    <text x="658" y="254" font-size="13.5" fill="#161616">・非互換・変更点の確認</text>
    <text x="658" y="284" font-size="13.5" fill="#161616">・テストと検証</text>
  </g>

  <!-- 04 本番稼働 -->
  <g>
    <rect x="940" y="80" width="226" height="240" rx="10" fill="#edf5ff" stroke="#0f62fe" stroke-width="2"/>
    <rect x="940" y="80" width="226" height="58" rx="10" fill="#0f62fe"/>
    <rect x="940" y="118" width="226" height="20" fill="#0f62fe"/>
    <circle cx="972" cy="109" r="18" fill="#ffffff"/>
    <text x="972" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f62fe">4</text>
    <text x="1000" y="103" font-size="16" font-weight="bold" fill="#ffffff">本番稼働</text>
    <text x="1000" y="124" font-size="12" fill="#d0e2ff">Go Live</text>
    <text x="958" y="170" font-size="13.5" fill="#161616">・稼働前チェックリスト</text>
    <text x="958" y="200" font-size="13.5" fill="#161616">・ユーザー招待と周知</text>
    <text x="958" y="230" font-size="13.5" fill="#161616">・切替とモニタリング</text>
    <text x="958" y="260" font-size="13.5" fill="#161616">・フィードバック収集</text>
  </g>

  <!-- 下部: 継続運用の帯 -->
  <rect x="40" y="350" width="1126" height="52" rx="8" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1"/>
  <text x="70" y="382" font-size="14" font-weight="bold" fill="#161616">継続運用：</text>
  <text x="160" y="382" font-size="13.5" fill="#393939">月次アップデートの確認　／　Environment Quota での使用量確認　／　ステータス・メンテナンス通知の購読</text>
</svg>
