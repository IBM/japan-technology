<defs><marker id="m0f62fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f62fe"/></marker><marker id="m525252" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/></marker><marker id="m007d79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007d79"/></marker></defs>
<text x="48" y="54" font-family="Noto Sans CJK JP" font-size="26" fill="#161616" font-weight="bold" text-anchor="start">組織アクティベーションの流れ(IBM SaaS アカウント経由)</text>
<text x="48" y="82" font-family="Noto Sans CJK JP" font-size="15" fill="#525252" font-weight="normal" text-anchor="start">インスタンスのデプロイ後、2 通の招待メールをそれぞれの宛先が承諾して管理者権限が有効化されます</text>
<rect x="45" y="110" width="250" height="78" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5" rx="4"/>
<text x="170" y="134" font-family="Noto Sans CJK JP" font-size="16" fill="#161616" font-weight="bold" text-anchor="middle">IBM SaaS アカウント・</text>
<text x="170" y="154" font-family="Noto Sans CJK JP" font-size="16" fill="#161616" font-weight="bold" text-anchor="middle">オーナー</text>
<text x="170" y="176" font-family="Noto Sans CJK JP" font-size="12" fill="#525252" font-weight="normal" text-anchor="middle">(初代 Enterprise Administrator)</text>
<rect x="345" y="110" width="250" height="78" fill="#f4f4f4" stroke="#525252" stroke-width="1.5" rx="4"/>
<text x="470" y="144" font-family="Noto Sans CJK JP" font-size="16" fill="#161616" font-weight="bold" text-anchor="middle">IBM SaaS アカウント</text>
<text x="470" y="168" font-family="Noto Sans CJK JP" font-size="12" fill="#525252" font-weight="normal" text-anchor="middle">(インスタンス管理)</text>
<rect x="645" y="110" width="250" height="78" fill="#f4f4f4" stroke="#525252" stroke-width="1.5" rx="4"/>
<text x="770" y="144" font-family="Noto Sans CJK JP" font-size="16" fill="#161616" font-weight="bold" text-anchor="middle">DataStax(Astra)</text>
<text x="770" y="168" font-family="Noto Sans CJK JP" font-size="12" fill="#525252" font-weight="normal" text-anchor="middle">(組織 / エンタープライズ)</text>
<rect x="955" y="110" width="250" height="78" fill="#d9fbfb" stroke="#007d79" stroke-width="1.5" rx="4"/>
<text x="1080" y="144" font-family="Noto Sans CJK JP" font-size="16" fill="#161616" font-weight="bold" text-anchor="middle">テナント・オーナー</text>
<text x="1080" y="168" font-family="Noto Sans CJK JP" font-size="12" fill="#525252" font-weight="normal" text-anchor="middle">(初代 Organization Administrator)</text>
<line x1="170" y1="202" x2="170" y2="660" stroke="#c6c6c6" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="470" y1="202" x2="470" y2="660" stroke="#c6c6c6" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="770" y1="202" x2="770" y2="660" stroke="#c6c6c6" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="1080" y1="202" x2="1080" y2="660" stroke="#c6c6c6" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="170" y1="250" x2="464" y2="250" stroke="#0f62fe" stroke-width="2" marker-end="url(#m0f62fe)"/>
<rect x="224.3" y="213" width="191.4" height="21" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="320.0" y="226" font-family="Noto Sans CJK JP" font-size="15" fill="#161616" font-weight="bold" text-anchor="middle">① インスタンスをデプロイ</text>
<rect x="93.19999999999999" y="233" width="453.6" height="18" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="320.0" y="243" font-family="Noto Sans CJK JP" font-size="12" fill="#525252" font-weight="normal" text-anchor="middle">(リージョン / インスタンス名 / テナント・オーナーのメールアドレスを指定)</text>
<line x1="470" y1="320" x2="764" y2="320" stroke="#525252" stroke-width="2" marker-end="url(#m525252)"/>
<rect x="469.1" y="283" width="301.8" height="21" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="620.0" y="296" font-family="Noto Sans CJK JP" font-size="15" fill="#161616" font-weight="bold" text-anchor="middle">② インスタンスが Running 状態に</text>
<rect x="492.56" y="303" width="254.88000000000002" height="18" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="620.0" y="313" font-family="Noto Sans CJK JP" font-size="12" fill="#525252" font-weight="normal" text-anchor="middle">(組織を生成。初回はエンタープライズも生成)</text>
<line x1="770" y1="395" x2="176" y2="395" stroke="#525252" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m525252)"/>
<rect x="360.5" y="358" width="219.0" height="21" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="470.0" y="371" font-family="Noto Sans CJK JP" font-size="15" fill="#161616" font-weight="bold" text-anchor="middle">③ エンタープライズ招待メール</text>
<rect x="392.24" y="378" width="155.52" height="18" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="470.0" y="388" font-family="Noto Sans CJK JP" font-size="12" fill="#525252" font-weight="normal" text-anchor="middle">(アカウント・オーナー宛)</text>
<line x1="770" y1="460" x2="1074" y2="460" stroke="#525252" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m525252)"/>
<rect x="850.0" y="423" width="150.0" height="21" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="925.0" y="436" font-family="Noto Sans CJK JP" font-size="15" fill="#161616" font-weight="bold" text-anchor="middle">③' 組織招待メール</text>
<rect x="852.76" y="443" width="144.48000000000002" height="18" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="925.0" y="453" font-family="Noto Sans CJK JP" font-size="12" fill="#525252" font-weight="normal" text-anchor="middle">(テナント・オーナー宛)</text>
<line x1="170" y1="540" x2="764" y2="540" stroke="#0f62fe" stroke-width="2" marker-end="url(#m0f62fe)"/>
<rect x="215.6" y="503" width="508.8" height="21" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="470.0" y="516" font-family="Noto Sans CJK JP" font-size="15" fill="#0f62fe" font-weight="bold" text-anchor="middle">④ IBMid で Astra Portal にサインインし、招待を承諾</text>
<rect x="285.75" y="522.5" width="368.5" height="18.5" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="470.0" y="533" font-family="Noto Sans CJK JP" font-size="12.5" fill="#0f62fe" font-weight="normal" text-anchor="middle">→ Enterprise Administrator が有効化</text>
<line x1="1080" y1="620" x2="776" y2="620" stroke="#007d79" stroke-width="2" marker-end="url(#m007d79)"/>
<rect x="760.3" y="583" width="329.40000000000003" height="21" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="925.0" y="596" font-family="Noto Sans CJK JP" font-size="15" fill="#007d79" font-weight="bold" text-anchor="middle">⑤ 招待受信アドレスでサインインし、招待を承諾</text>
<rect x="587.8" y="603" width="674.4" height="18" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><text x="925.0" y="613" font-family="Noto Sans CJK JP" font-size="12" fill="#007d79" font-weight="normal" text-anchor="middle">(任意のサインイン方式 / IBM ID SSO 可)→ Organization Administrator が有効化</text>
<rect x="48" y="682" width="1144" height="74" fill="#fcf4d6" stroke="#8e6a00" stroke-width="1" rx="4"/>
<text x="66" y="708" font-family="Noto Sans CJK JP" font-size="13.5" fill="#161616" font-weight="normal" text-anchor="start">④と⑤は順不同。それぞれの宛先本人による承諾が必要です(代理承諾は不可 / すべてのインスタンスが同一オーナーでも承諾が必要)</text>
<text x="66" y="734" font-family="Noto Sans CJK JP" font-size="13.5" fill="#161616" font-weight="normal" text-anchor="start">アドレスが異なる場合は両方の受信箱を確認してください。48 時間以内に招待メールが届かない場合は IBM Support へ連絡します</text>
<text x="48" y="784" font-family="Noto Sans CJK JP" font-size="12" fill="#525252" font-weight="normal" text-anchor="start">出典:DataStax Docs「Manage plans」「Manage organizations」に基づき作成(2026 年 8 月時点)</text>
</svg>