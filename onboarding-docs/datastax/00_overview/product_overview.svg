<text x="620.0" y="186" font-family="Noto Sans CJK JP" font-size="15" fill="#525252" font-weight="normal" text-anchor="middle">RAG(検索拡張生成)/ ナレッジ埋め込み / セマンティック検索</text>
<line x1="330" y1="268" x2="330" y2="216" stroke="#525252" stroke-width="2" marker-end="url(#ar)"/>
