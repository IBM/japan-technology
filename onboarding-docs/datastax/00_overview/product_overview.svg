<text x="144" y="400" font-family="Noto Sans CJK JP" font-size="14" fill="#161616" font-weight="normal" text-anchor="start">・構造化 / 非構造化データの統合</text>
<text x="144" y="428" font-family="Noto Sans CJK JP" font-size="14" fill="#161616" font-weight="normal" text-anchor="start">・複数エンジン / マルチクラウド対応</text>
<text x="144" y="456" font-family="Noto Sans CJK JP" font-size="14" fill="#161616" font-weight="normal" text-anchor="start">・watsonx ポートフォリオの基盤</text>
