<rect x="0" y="0" width="1240" height="6" fill="#0f62fe" stroke="none" stroke-width="0" rx="0"/>
<text x="48" y="58" font-family="Noto Sans CJK JP" font-size="28" fill="#161616" font-weight="bold" text-anchor="start">IBM DataStax と watsonx.data の関係</text>
<text x="48" y="88" font-family="Noto Sans CJK JP" font-size="16" fill="#525252" font-weight="normal" text-anchor="start">ベクトル検索により watsonx.data の NoSQL データベース機能を強化し、生成 AI のユースケースを支える</text>
