<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="860" height="340" fill="#ffffff"/>

  <!-- ===== Group: ローカル開発環境 ===== -->
  <rect x="20" y="40" width="220" height="260" rx="8" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="130" y="30" text-anchor="middle" font-size="12" fill="#57606a" font-weight="600">ローカル開発環境</text>

  <!-- Tool box -->
  <rect x="44" y="64" width="172" height="80" rx="6" fill="#ffffff" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="130" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Tool</text>
  <text x="130" y="108" text-anchor="middle" font-size="11" fill="#57606a">Python 関数</text>
  <text x="130" y="124" text-anchor="middle" font-size="11" fill="#57606a">OpenAPI / MCP</text>

  <!-- Agent box -->
  <rect x="44" y="184" width="172" height="80" rx="6" fill="#ffffff" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="130" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Agent</text>
  <text x="130" y="228" text-anchor="middle" font-size="11" fill="#57606a">YAML 定義</text>
  <text x="130" y="244" text-anchor="middle" font-size="11" fill="#57606a">LLM / ツール / 指示</text>

  <!-- ===== ADK CLI ===== -->
  <rect x="300" y="120" width="160" height="80" rx="6" fill="#1f2328" stroke="#1f2328" stroke-width="1.5"/>
  <text x="380" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ADK CLI</text>
  <text x="380" y="172" text-anchor="middle" font-size="11" fill="#9ca3af">orchestrate import</text>

  <!-- Arrow: Tool → CLI -->
  <line x1="216" y1="104" x2="299" y2="148" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- Arrow: Agent → CLI -->
  <line x1="216" y1="224" x2="299" y2="172" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ===== Group: watsonx Orchestrate ===== -->
  <rect x="520" y="40" width="230" height="260" rx="8" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="635" y="30" text-anchor="middle" font-size="12" fill="#57606a" font-weight="600">watsonx Orchestrate</text>

  <!-- Tool (imported) -->
  <rect x="544" y="64" width="182" height="60" rx="6" fill="#ffffff" stroke="#7c5cd8" stroke-width="1.5"/>
  <text x="635" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Tool</text>
  <text x="635" y="112" text-anchor="middle" font-size="11" fill="#57606a">インポート済みツール</text>

  <!-- Agent (imported) -->
  <rect x="544" y="164" width="182" height="60" rx="6" fill="#ffffff" stroke="#7c5cd8" stroke-width="1.5"/>
  <text x="635" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Agent</text>
  <text x="635" y="212" text-anchor="middle" font-size="11" fill="#57606a">インポート済みエージェント</text>

  <!-- Arrow: Tool → Agent inside wxo -->
  <line x1="635" y1="124" x2="635" y2="163" stroke="#7c5cd8" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Arrow: CLI → wxo Tool -->
  <line x1="460" y1="148" x2="543" y2="94" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- Arrow: CLI → wxo Agent -->
  <line x1="460" y1="172" x2="543" y2="194" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ===== User ===== -->
  <rect x="780" y="164" width="64" height="60" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="812" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2328">ユーザー</text>
  <text x="812" y="210" text-anchor="middle" font-size="10" fill="#57606a">チャット UI</text>

  <!-- Arrow: Agent → User -->
  <line x1="726" y1="194" x2="779" y2="194" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow-gray)" stroke-dasharray="5,3"/>

  <!-- ===== Arrowhead markers ===== -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82d4"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c5cd8"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#57606a"/>
    </marker>
  </defs>

</svg>
