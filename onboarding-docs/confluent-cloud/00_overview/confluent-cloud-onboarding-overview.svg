<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="IBM Confluent Cloud オンボーディングの流れ（契約とアカウント、初期設定、利用方法、サポートと運用）">
  <style>
    text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',sans-serif;}
    .figtitle{fill:#161616;font-size:22px;font-weight:700;}
    .hdr{fill:#2b62f6;}
    .body{fill:#f5f8ff;stroke:#2b62f6;stroke-width:1.5;}
    .num{fill:#ffffff;}
    .numtext{fill:#2b62f6;font-size:17px;font-weight:700;}
    .htitle{fill:#ffffff;font-size:17px;font-weight:700;}
    .hsub{fill:#dbe6ff;font-size:10.5px;}
    .item{fill:#333333;font-size:12.5px;}
    .arrow{stroke:#2b62f6;stroke-width:3;fill:none;marker-end:url(#ah);}
    .opsbar{fill:#f4f4f4;stroke:#c6c6c6;stroke-width:1;}
    .opslabel{fill:#161616;font-size:13px;font-weight:700;}
    .opstext{fill:#333333;font-size:12.5px;}
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b62f6"/>
    </marker>
  </defs>
  <text class="figtitle" x="600" y="34" text-anchor="middle">IBM Confluent Cloud オンボーディングの流れ</text>

  <!-- Box 1 -->
  <rect class="body" x="30" y="60" width="255" height="230" rx="8"/>
  <path class="hdr" d="M30,68 a8,8 0 0 1 8,-8 h239 a8,8 0 0 1 8,8 v40 h-255 z"/>
  <circle class="num" cx="52" cy="80" r="12"/><text class="numtext" x="52" y="86" text-anchor="middle">1</text>
  <text class="htitle" x="72" y="86">契約とアカウント</text>
  <text class="hsub" x="72" y="101">Account &amp; Access</text>
  <text class="item" x="46" y="136">・契約経路とプランの確認</text>
  <text class="item" x="46" y="162">・サインアップと支払い方法</text>
  <text class="item" x="46" y="188">・ユーザー追加と SSO</text>
  <text class="item" x="46" y="214">・RBAC と API キー</text>

  <!-- Box 2 -->
  <rect class="body" x="335" y="60" width="255" height="230" rx="8"/>
  <path class="hdr" d="M335,68 a8,8 0 0 1 8,-8 h239 a8,8 0 0 1 8,8 v40 h-255 z"/>
  <circle class="num" cx="357" cy="80" r="12"/><text class="numtext" x="357" y="86" text-anchor="middle">2</text>
  <text class="htitle" x="377" y="86">初期設定</text>
  <text class="hsub" x="377" y="101">Setup</text>
  <text class="item" x="351" y="136">・環境と Stream Governance</text>
  <text class="item" x="351" y="162">・クラスタータイプ／リージョン</text>
  <text class="item" x="351" y="188">・ネットワークとセキュリティ</text>
  <text class="item" x="351" y="214">・コストのガードレール</text>

  <!-- Box 3 -->
  <rect class="body" x="640" y="60" width="255" height="230" rx="8"/>
  <path class="hdr" d="M640,68 a8,8 0 0 1 8,-8 h239 a8,8 0 0 1 8,8 v40 h-255 z"/>
  <circle class="num" cx="662" cy="80" r="12"/><text class="numtext" x="662" y="86" text-anchor="middle">3</text>
  <text class="htitle" x="682" y="86">利用方法</text>
  <text class="hsub" x="682" y="101">Usage</text>
  <text class="item" x="656" y="136">・Topic 作成とクライアント接続</text>
  <text class="item" x="656" y="162">・コネクターによる連携</text>
  <text class="item" x="656" y="188">・Flink／キューイング</text>
  <text class="item" x="656" y="214">・既存 Kafka からの移行</text>

  <!-- Box 4 -->
  <rect class="body" x="945" y="60" width="225" height="230" rx="8"/>
  <path class="hdr" d="M945,68 a8,8 0 0 1 8,-8 h209 a8,8 0 0 1 8,8 v40 h-225 z"/>
  <circle class="num" cx="967" cy="80" r="12"/><text class="numtext" x="967" y="86" text-anchor="middle">4</text>
  <text class="htitle" x="987" y="86">サポートと運用</text>
  <text class="hsub" x="987" y="101">Support &amp; Operations</text>
  <text class="item" x="961" y="136">・サポートプランの選択</text>
  <text class="item" x="961" y="162">・Confluent Support Portal</text>
  <text class="item" x="961" y="188">・監視とクォータ</text>
  <text class="item" x="961" y="214">・学習リソース</text>

  <path class="arrow" d="M287,175 L331,175"/>
  <path class="arrow" d="M592,175 L636,175"/>
  <path class="arrow" d="M897,175 L941,175"/>

  <!-- 継続運用バー -->
  <rect class="opsbar" x="30" y="320" width="1140" height="44" rx="4"/>
  <text class="opslabel" x="52" y="347">継続運用：</text>
  <text class="opstext" x="150" y="347">リリースノートの確認　／　コスト・クレジット残高の確認　／　通知の購読　／　サービス稼働状況の確認</text>
</svg>
